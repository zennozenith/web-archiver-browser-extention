<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <h1>URL Archiver</h1>
      <div class="actions">
        <button id="recheck" class="icon" title="Re-check archive status">
          ⟳
        </button>
        <button id="refresh" class="icon" title="Refresh pending list">
          ↻
        </button>
        <button id="prefs" class="icon" title="Preferences">⚙</button>
      </div>
    </header>

    <section id="current">
      <div class="page">
        <div id="curTitle" class="title">…</div>
        <div id="curUrl" class="url"></div>
      </div>
      <div id="archInfo" class="archinfo"></div>
      <button id="archiveNow" class="primary">Archive this page</button>
      <div id="curStatus" class="status"></div>
    </section>

    <section>
      <div class="listhead">
        <h2>Pending <span id="count"></span></h2>
        <input id="filter" type="search" placeholder="Filter…">
      </div>
      <div id="meta" class="meta"></div>
      <ul id="list"></ul>
    </section>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
