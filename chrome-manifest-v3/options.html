<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>URL Archiver – Settings</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 640px; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
  h1 { font-size: 1.4rem; } h2 { font-size: 1.05rem; margin-top: 2rem; border-bottom: 1px solid #8884; padding-bottom: .3rem; }
  label { display: block; margin: .8rem 0 .25rem; font-weight: 600; }
  input[type=text], input[type=url], input[type=password], input[type=number], select {
    width: 100%; box-sizing: border-box; padding: .5rem; font: inherit; }
  .check { display: flex; gap: .5rem; align-items: center; font-weight: normal; margin: .5rem 0; }
  small { opacity: .7; display: block; margin-top: .2rem; }
  button { font: inherit; padding: .5rem 1rem; margin-right: .5rem; cursor: pointer; }
  #status { margin-top: 1rem; min-height: 1.4em; }
  .ok { color: #2e9e4f; } .err { color: #d33; }
</style>
</head>
<body>
<h1>URL Archiver – Settings</h1>

<h2>Server</h2>
<label for="serverUrl">Archive endpoint URL</label>
<input type="url" id="serverUrl" placeholder="https://archive.example.com/api/archive">
<small>Receives a JSON <code>POST</code> for every capture.</small>

<label for="authMode">Authentication</label>
<select id="authMode">
  <option value="none">None</option>
  <option value="bearer">Bearer token (Authorization header)</option>
  <option value="custom">Custom header</option>
</select>
<div id="customName">
  <label for="authHeaderName">Header name</label>
  <input type="text" id="authHeaderName" placeholder="X-API-Key">
</div>
<div id="tokenRow">
  <label for="authToken">Token / key</label>
  <input type="password" id="authToken" autocomplete="off">
</div>

<label for="timeoutSec">Request timeout (seconds)</label>
<input type="number" id="timeoutSec" min="1" max="600">

<h2>What to capture</h2>
<label class="check"><input type="checkbox" id="includeHtml"> Page HTML (rendered DOM)</label>
<label class="check"><input type="checkbox" id="includeRequestHeaders"> Request headers</label>
<label class="check"><input type="checkbox" id="includeResponseHeaders"> Response headers</label>
<label class="check"><input type="checkbox" id="includeCookies"> Cookies for the page <small>(asks for the “cookies” permission)</small></label>
<label class="check"><input type="checkbox" id="includeScreenshot"> Screenshot of the visible area (JPEG, base64)</label>

<label for="redactHeaders">Redact these headers</label>
<input type="text" id="redactHeaders" placeholder="authorization, cookie">
<small>Comma-separated. Values are replaced with [REDACTED] in request and response headers.</small>

<label for="tags">Tags</label>
<input type="text" id="tags" placeholder="research, to-read">
<small>Comma-separated; sent with every capture.</small>

<p style="margin-top:2rem">
  <button id="save">Save</button>
  <button id="test" type="button">Test connection</button>
</p>
<div id="status"></div>
<script src="options.js"></script>
</body>
</html>
